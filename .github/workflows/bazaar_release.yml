name: Build & Release for Cafe Bazaar

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build artifact type (both, aab, apk)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aab
          - apk

jobs:
  test_and_build:
    name: Verify Tests & Build Cafe Bazaar Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper / Permissions
        run: |
          chmod +x gradlew

      # Step 1: Ensure debug keystore exists (restore from base64 if needed)
      - name: Configure Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Debug keystore restored from base64."
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Debug keystore generated."
            fi
          fi

      # Step 2: Configure Release Keystore from GitHub Secrets or local/fallback
      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BAZAAR_RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.BAZAAR_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PWD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PWD:-android}" >> $GITHUB_ENV
            echo "Release keystore decoded from GitHub Secrets."
          elif [ -f "${{ github.workspace }}/my-upload-key.jks" ]; then
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PWD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PWD:-android}" >> $GITHUB_ENV
            echo "Existing upload keystore found in workspace."
          else
            echo "NOTICE: BAZAAR_RELEASE_KEYSTORE_BASE64 not set; generating CI fallback upload keystore."
            keytool -genkey -v -keystore "${{ github.workspace }}/my-upload-key.jks" -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bazaar Release CI,O=FarshBazaar,C=IR"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      # Step 3: Inject Safe Environment Secrets (.env)
      - name: Configure Secrets & Environment (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}
          SMS_GATEWAY_API_KEY: ${{ secrets.SMS_GATEWAY_API_KEY }}
          BAZAAR_PURCHASE_PUBLIC_KEY: ${{ secrets.BAZAAR_PURCHASE_PUBLIC_KEY }}
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi
          if [ -n "$SHAHKAR_API_KEY" ]; then
            echo "SHAHKAR_API_KEY=$SHAHKAR_API_KEY" >> .env
          fi
          if [ -n "$SMS_GATEWAY_API_KEY" ]; then
            echo "SMS_GATEWAY_API_KEY=$SMS_GATEWAY_API_KEY" >> .env
          fi
          if [ -n "$BAZAAR_PURCHASE_PUBLIC_KEY" ]; then
            echo "BAZAAR_PURCHASE_PUBLIC_KEY=$BAZAAR_PURCHASE_PUBLIC_KEY" >> .env
          fi
          echo ".env prepared with injected secrets."

      # Step 4: Run Automated Unit Tests
      - name: Run Automated Test Suite
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # Step 5: Build Signed Android App Bundle (AAB) for Cafe Bazaar
      - name: Build Release Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'aab' || github.event_name == 'push' }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      # Step 6: Build Signed Universal Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk' || github.event_name == 'push' }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Step 7: Generate SHA-256 Checksums for Integrity
      - name: Generate Checksums
        run: |
          mkdir -p release_outputs
          find app/build/outputs -type f \( -name "*.aab" -o -name "*.apk" \) -exec cp {} release_outputs/ \;
          cd release_outputs
          if ls *.aab *.apk 1> /dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      # Step 8: Upload Artifacts to GitHub Actions
      - name: Archive Production Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-release-artifacts
          path: release_outputs/
          retention-days: 30
