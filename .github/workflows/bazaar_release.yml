name: Build & Release for Cafe Bazaar

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build artifact type (both, aab, apk)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aab
          - apk

jobs:
  test_and_build:
    name: Verify Tests & Build Cafe Bazaar Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Gradle Wrapper / Permissions
        run: |
          chmod +x gradlew || true

      # Step 1: Securely decode and write Release Keystore from GitHub Secrets
      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BAZAAR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "Release keystore decoded successfully."
          else
            echo "NOTICE: BAZAAR_RELEASE_KEYSTORE_BASE64 not set; checking for local keystore."
          fi

      # Step 2: Inject Safe Environment Secrets (.env)
      - name: Configure Secrets & Environment (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}
          SMS_GATEWAY_API_KEY: ${{ secrets.SMS_GATEWAY_API_KEY }}
          BAZAAR_PURCHASE_PUBLIC_KEY: ${{ secrets.BAZAAR_PURCHASE_PUBLIC_KEY }}
        run: |
          echo "# Production Environment Secrets" > .env
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi
          if [ -n "$SHAHKAR_API_KEY" ]; then
            echo "SHAHKAR_API_KEY=$SHAHKAR_API_KEY" >> .env
          fi
          if [ -n "$SMS_GATEWAY_API_KEY" ]; then
            echo "SMS_GATEWAY_API_KEY=$SMS_GATEWAY_API_KEY" >> .env
          fi
          if [ -n "$BAZAAR_PURCHASE_PUBLIC_KEY" ]; then
            echo "BAZAAR_PURCHASE_PUBLIC_KEY=$BAZAAR_PURCHASE_PUBLIC_KEY" >> .env
          fi
          echo ".env prepared with injected secrets (file ignored by git)."

      # Step 3: Run Full Unit & Critical User Journey Tests
      - name: Run Automated Test Suite
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      # Step 4: Build Signed Android App Bundle (AAB) for Cafe Bazaar
      - name: Build Release Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'aab' || github.event_name == 'push' }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.BAZAAR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          gradle :app:bundleRelease --no-daemon --stacktrace

      # Step 5: Build Signed Universal Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk' || github.event_name == 'push' }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.BAZAAR_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      # Step 6: Generate SHA-256 Checksums for Integrity
      - name: Generate Checksums
        run: |
          mkdir -p release_outputs
          find app/build/outputs -type f \( -name "*.aab" -o -name "*.apk" \) -exec cp {} release_outputs/ \;
          cd release_outputs
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Step 7: Upload Artifacts to GitHub Actions
      - name: Archive Production Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-release-artifacts
          path: release_outputs/
          retention-days: 30
