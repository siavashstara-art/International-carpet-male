name: Build & Release for Cafe Bazaar

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build artifact type (both, aab, apk)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aab
          - apk

jobs:
  test_and_build:
    name: Verify Tests & Build Cafe Bazaar Artifacts
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.BAZAAR_STORE_PASSWORD != '' && secrets.BAZAAR_STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD != '' && secrets.BAZAAR_KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper / Permissions
        run: |
          chmod +x gradlew

      # Step 1: Ensure debug keystore exists (restore from base64 if needed)
      - name: Configure Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Debug keystore restored from base64."
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Debug keystore generated."
            fi
          fi

      # Step 2: Configure Release Keystore from GitHub Secrets or local/fallback
      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BAZAAR_RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.BAZAAR_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "Release keystore decoded from GitHub Secrets."
          elif [ ! -f "$KEYSTORE_FILE" ]; then
            echo "NOTICE: my-upload-key.jks not found; generating new upload keystore for CI release."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bazaar Release CI,O=FarshBazaar,C=IR"
          else
            echo "Using existing my-upload-key.jks from repository workspace."
          fi

          FINAL_STORE_PWD="${STORE_PWD:-android}"
          FINAL_KEY_PWD="${KEY_PWD:-android}"

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$FINAL_STORE_PWD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$FINAL_KEY_PWD" >> $GITHUB_ENV

      # Step 3: Inject Safe Environment Secrets (.env)
      - name: Configure Secrets & Environment (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHAHKAR_API_KEY: ${{ secrets.SHAHKAR_API_KEY }}
          SMS_GATEWAY_API_KEY: ${{ secrets.SMS_GATEWAY_API_KEY }}
          BAZAAR_PURCHASE_PUBLIC_KEY: ${{ secrets.BAZAAR_PURCHASE_PUBLIC_KEY }}
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          [ -n "$SHAHKAR_API_KEY" ] && echo "SHAHKAR_API_KEY=$SHAHKAR_API_KEY" >> .env
          [ -n "$SMS_GATEWAY_API_KEY" ] && echo "SMS_GATEWAY_API_KEY=$SMS_GATEWAY_API_KEY" >> .env
          [ -n "$BAZAAR_PURCHASE_PUBLIC_KEY" ] && echo "BAZAAR_PURCHASE_PUBLIC_KEY=$BAZAAR_PURCHASE_PUBLIC_KEY" >> .env
          echo ".env prepared with injected secrets."

      # Step 4: Run Automated Unit Tests
      - name: Run Automated Test Suite
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.BAZAAR_STORE_PASSWORD != '' && secrets.BAZAAR_STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD != '' && secrets.BAZAAR_KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      # Step 5: Build Signed Android App Bundle (AAB) for Cafe Bazaar
      - name: Build Release Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'aab' || github.event_name == 'push' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.BAZAAR_STORE_PASSWORD != '' && secrets.BAZAAR_STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD != '' && secrets.BAZAAR_KEY_PASSWORD || 'android' }}
        run: |
          STORE_PASSWORD="${STORE_PASSWORD:-android}" \
          KEY_PASSWORD="${KEY_PASSWORD:-android}" \
          KEYSTORE_PATH="${KEYSTORE_PATH:-${GITHUB_WORKSPACE}/my-upload-key.jks}" \
          ./gradlew :app:bundleRelease --no-daemon --no-configuration-cache --stacktrace

      # Step 6: Build Signed Universal Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk' || github.event_name == 'push' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.BAZAAR_STORE_PASSWORD != '' && secrets.BAZAAR_STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD != '' && secrets.BAZAAR_KEY_PASSWORD || 'android' }}
        run: |
          STORE_PASSWORD="${STORE_PASSWORD:-android}" \
          KEY_PASSWORD="${KEY_PASSWORD:-android}" \
          KEYSTORE_PATH="${KEYSTORE_PATH:-${GITHUB_WORKSPACE}/my-upload-key.jks}" \
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      # Step 7: Generate SHA-256 Checksums for Integrity
      - name: Generate Checksums
        run: |
          mkdir -p release_outputs
          find app/build/outputs -type f \( -name "*.aab" -o -name "*.apk" \) -exec cp {} release_outputs/ \;
          cd release_outputs
          if ls *.aab *.apk 1> /dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      # Step 8: Upload Artifacts to GitHub Actions
      - name: Archive Production Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-release-artifacts
          path: release_outputs/
          retention-days: 30
